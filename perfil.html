<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0D12">
<title>BuildPC — Editar perfil</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind.config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- Biblioteca do Supabase (conta e perfil) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>

<body class="bg-bg-light dark:bg-bg text-ink-light dark:text-ink font-body transition-colors duration-300 min-h-screen">

  <nav class="sticky top-0 z-50 flex items-center justify-between px-6 md:px-[6vw] py-5 border-b border-line-light dark:border-line backdrop-blur bg-bg-light/85 dark:bg-bg/85">
    <a href="index.html" class="flex items-center gap-2 font-display font-semibold text-[15px]">
      <svg class="w-[18px] h-[18px] text-copper-light dark:text-copper" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="1.5"/>
        <rect x="10" y="10" width="4" height="4"/>
        <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
      </svg>
      BuildPC
    </a>
    <div class="flex items-center gap-6 text-sm">
      <a href="guia.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Guia</a>
      <div id="conta-area" class="relative flex items-center">
        <a href="login.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Entrar</a>
      </div>
      <button id="theme-btn"
        class="flex items-center gap-2 text-xs font-mono px-3 py-2 rounded-full border border-line-light dark:border-line bg-panel-light dark:bg-panel hover:border-copper-light dark:hover:border-copper transition-colors">
        <span id="theme-label">Modo claro</span>
      </button>
    </div>
  </nav>

  <main class="px-6 py-14 md:py-20 flex justify-center">
    <!-- Fica escondido até confirmar que a pessoa está logada -->
    <div id="perfil-card" class="hidden w-full max-w-md space-y-6">
      <div>
        <h1 class="font-display font-semibold text-2xl mb-1">Editar perfil</h1>
        <p class="text-sm text-muted-light dark:text-muted">Atualize seu nome e sua senha.</p>
      </div>

      <section class="border border-line-light dark:border-line rounded-xl p-6 bg-panel-light dark:bg-panel">
        <h2 class="font-display font-semibold text-base mb-4">Seus dados</h2>
        <div id="perfil-msg" class="hidden mb-4 text-sm rounded-lg px-3 py-2" aria-live="polite"></div>
        <form id="form-perfil" novalidate>
          <div class="mb-4">
            <label for="perfil-email" class="block text-sm mb-1.5">E-mail</label>
            <input type="email" id="perfil-email" readonly aria-describedby="perfil-email-ajuda"
              class="w-full rounded-lg border border-line-light dark:border-line bg-bg-light dark:bg-bg px-3.5 py-2.5 text-sm opacity-70 cursor-not-allowed outline-none">
            <p id="perfil-email-ajuda" class="mt-1.5 text-xs text-muted-light dark:text-muted">O e-mail é o seu login e não pode ser alterado aqui.</p>
          </div>
          <div class="mb-5">
            <label for="perfil-nome" class="block text-sm mb-1.5">Nome</label>
            <input type="text" id="perfil-nome" name="nome" autocomplete="name" maxlength="60"
              class="w-full rounded-lg border border-line-light dark:border-line bg-bg-light dark:bg-bg px-3.5 py-2.5 text-sm outline-none focus-visible:border-copper-light dark:focus-visible:border-copper transition-colors"
              placeholder="Como você quer ser chamado(a)">
          </div>
          <button type="submit" id="btn-perfil"
            class="w-full bg-copper-light dark:bg-copper text-white font-display font-semibold text-sm px-5 py-3 rounded-lg hover:brightness-110 transition-[filter] disabled:opacity-60 disabled:cursor-not-allowed">
            Salvar nome
          </button>
        </form>
      </section>

      <section class="border border-line-light dark:border-line rounded-xl p-6 bg-panel-light dark:bg-panel">
        <h2 class="font-display font-semibold text-base mb-4">Alterar senha</h2>
        <div id="senha-msg" class="hidden mb-4 text-sm rounded-lg px-3 py-2" aria-live="polite"></div>
        <form id="form-senha" novalidate>
          <div class="mb-4">
            <label for="senha-nova" class="block text-sm mb-1.5">Nova senha</label>
            <input type="password" id="senha-nova" name="nova-senha" autocomplete="new-password" minlength="6"
              class="w-full rounded-lg border border-line-light dark:border-line bg-bg-light dark:bg-bg px-3.5 py-2.5 text-sm outline-none focus-visible:border-copper-light dark:focus-visible:border-copper transition-colors">
          </div>
          <div class="mb-5">
            <label for="senha-confirma" class="block text-sm mb-1.5">Confirmar nova senha</label>
            <input type="password" id="senha-confirma" name="confirmar-senha" autocomplete="new-password" minlength="6"
              class="w-full rounded-lg border border-line-light dark:border-line bg-bg-light dark:bg-bg px-3.5 py-2.5 text-sm outline-none focus-visible:border-copper-light dark:focus-visible:border-copper transition-colors">
          </div>
          <button type="submit" id="btn-senha"
            class="w-full border border-line-light dark:border-line text-ink-light dark:text-ink font-display font-semibold text-sm px-5 py-3 rounded-lg hover:border-copper-light dark:hover:border-copper transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
            Alterar senha
          </button>
        </form>
      </section>

      <p class="text-center text-xs text-muted-light dark:text-muted">
        <a href="index.html" class="hover:text-ink-light dark:hover:text-ink transition-colors">← Voltar para o início</a>
      </p>
    </div>
  </main>

  <script src="perfil.js"></script>
  <script src="conta.js"></script>
  <script src="script.js"></script>
</body>
</html>
