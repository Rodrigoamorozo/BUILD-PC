<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0D12">
<title>BuildPC — Montar PC</title>
 
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind.config.js"></script>
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
 
<link rel="stylesheet" href="style.css">
 
<!-- Biblioteca do Supabase (banco de dados das peças) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>
 
<body class="bg-bg-light dark:bg-bg text-ink-light dark:text-ink font-body transition-colors duration-300 min-h-screen">
 
  <nav class="sticky top-0 z-50 flex items-center justify-between px-6 md:px-[6vw] py-5 border-b border-line-light dark:border-line backdrop-blur bg-bg-light/85 dark:bg-bg/85">
    <a href="index.html" class="flex items-center gap-2 font-display font-semibold text-[15px]">
      <svg class="w-[18px] h-[18px] text-copper-light dark:text-copper" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="1.5"/>
        <rect x="10" y="10" width="4" height="4"/>
        <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
      </svg>
      BuildPC
    </a>
    <div class="flex items-center gap-6 text-sm">
      <a href="guia.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Guia</a>
      <div id="conta-area" class="relative flex items-center">
        <a href="login.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Entrar</a>
      </div>
      <button id="theme-btn"
      class="flex items-center gap-2 text-xs font-mono px-3 py-2 rounded-full border border-line-light dark:border-line bg-panel-light dark:bg-panel hover:border-copper-light dark:hover:border-copper transition-colors">
      <span id="theme-label">Modo claro</span>
    </button>
    </div>
  </nav>

  <section class="px-6 md:px-[6vw] py-16">
    <h1 class="font-display font-semibold text-[clamp(28px,4.5vw,44px)] mb-3">Monte seu PC</h1>
    <p class="text-muted-light dark:text-muted max-w-[520px] mb-10">
      Escolha uma peça de cada categoria. O total e os avisos de compatibilidade
      atualizam sozinhos conforme você monta.
    </p>

    <!-- Modelos prontos e orçamento -->
    <div class="mb-6 rounded-xl border border-line-light dark:border-line bg-panel-light dark:bg-panel p-4">
      <p class="mb-2 text-xs text-muted-light dark:text-muted">
        Comece por um modelo pronto — ou diga quanto você tem para gastar:
      </p>
      <div id="modelos" class="mb-3 flex flex-wrap gap-2 text-xs"></div>
      <div class="flex flex-wrap items-center gap-2">
        <input id="orcamento" type="number" min="1500" step="100" inputmode="numeric" placeholder="R$ 6.000"
          aria-label="Orçamento em reais"
          class="w-36 rounded-lg border border-line-light dark:border-line bg-bg-light dark:bg-bg px-3 py-2 text-sm outline-none transition-colors focus-visible:border-copper-light dark:focus-visible:border-copper">
        <button type="button" id="btn-orcamento"
          class="rounded-lg bg-copper-light dark:bg-copper px-4 py-2 text-sm font-medium text-white transition-opacity hover:opacity-90">
          Montar
        </button>
        <span id="orcamento-msg" class="text-xs text-muted-light dark:text-muted" role="status"></span>
      </div>
    </div>

    <!-- Abas de categoria -->
    <div id="categorias" class="flex flex-wrap gap-x-1 gap-y-0 mb-4 text-sm border-b border-line-light dark:border-line"></div>

    <!-- Dica da categoria ativa -->
    <div id="dica-categoria" class="mb-6"></div>

    <!-- Busca e filtros por marca -->
    <div class="mb-6 space-y-3">
      <div class="relative max-w-md">
        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-light dark:text-muted"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="busca" type="search" autocomplete="off" aria-label="Buscar peça ou marca"
          class="w-full rounded-lg border border-line-light dark:border-line bg-panel-light dark:bg-panel py-2.5 pl-9 pr-9 text-sm outline-none transition-colors focus-visible:border-copper-light dark:focus-visible:border-copper"
          placeholder="Buscar peça ou marca…">
        <button type="button" id="limpar-busca" aria-label="Limpar busca"
          class="absolute right-2 top-1/2 hidden -translate-y-1/2 p-1 text-muted-light dark:text-muted transition-colors hover:text-ink-light dark:hover:text-ink">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>

      <div id="filtros-marca" class="flex flex-wrap items-center gap-2 text-xs"></div>

      <p id="resultado-info" class="hidden text-xs text-muted-light dark:text-muted" role="status"></p>
    </div>

    <!-- Aviso quando as peças não vêm do banco (ou faltam colunas nele) -->
    <p id="banco-aviso" class="hidden mb-6 text-sm rounded-lg px-4 py-3 border border-yellow-500/40 bg-yellow-500/10 text-yellow-500" role="status"></p>

    <!-- Aviso de lista filtrada por compatibilidade -->
    <p id="filtro-info" class="hidden text-sm text-cyan-light dark:text-cyan mb-6"></p>

    <!-- Avisos de incompatibilidade -->
    <div id="avisos" class="hidden mb-8 border border-red-500/40 bg-red-500/10 text-red-400 rounded-lg px-4 py-3 text-sm space-y-1" aria-live="polite"></div>

    <div class="flex flex-col lg:flex-row gap-10">
      <!-- Grade de peças da categoria ativa -->
      <div id="pecas-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1"></div>

      <!-- Resumo do build -->
      <aside class="lg:w-[300px] shrink-0">
        <!-- Resumo + gargalo juntos e grudados: rolar a grade não tira o gargalo da tela -->
        <div class="space-y-4 lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] lg:overflow-y-auto lg:pr-1">
          <div class="border border-line-light dark:border-line rounded-xl p-6 bg-panel-light dark:bg-panel">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-display font-semibold text-base">Seu build</h3>
              <span id="resumo-contagem" class="font-mono text-[11px] text-muted-light dark:text-muted"></span>
            </div>
            <div id="resumo-progresso" class="flex gap-1.5 mb-5"></div>
            <ul id="resumo-lista" class="text-sm space-y-2 mb-5 min-h-[40px]"></ul>
            <div class="flex items-center justify-between pt-4 border-t border-line-light dark:border-line">
              <span class="text-sm text-muted-light dark:text-muted">Total</span>
              <span id="total-preco" class="font-display font-semibold text-lg text-copper-light dark:text-copper">R$ 0</span>
            </div>

            <div class="mt-4 grid grid-cols-2 gap-2">
              <button type="button" id="btn-salvar"
                class="rounded-lg border border-line-light dark:border-line px-3 py-2 text-xs text-muted-light dark:text-muted transition-colors hover:text-ink-light dark:hover:text-ink">
                Salvar
              </button>
              <button type="button" id="btn-compartilhar"
                class="rounded-lg border border-line-light dark:border-line px-3 py-2 text-xs text-muted-light dark:text-muted transition-colors hover:text-ink-light dark:hover:text-ink">
                Compartilhar
              </button>
            </div>

            <select id="builds-salvos" aria-label="Builds salvos"
              class="mt-2 w-full rounded-lg border border-line-light dark:border-line bg-bg-light dark:bg-bg px-3 py-2 text-xs text-muted-light dark:text-muted">
              <option value="">Builds salvos…</option>
            </select>
          </div>

          <div id="gargalo-info" class="hidden border border-line-light dark:border-line rounded-xl p-6 bg-panel-light dark:bg-panel"></div>
        </div>
      </aside>
    </div>
  </section>

  <script src="precos.js"></script>
  <script src="fotos.js"></script>
  <script src="build.js"></script>
  <script src="conta.js"></script>
  <script src="script.js"></script>
</body>
</html>
