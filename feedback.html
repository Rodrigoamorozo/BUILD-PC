<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0D12">
<meta name="description" content="Conte o que você achou do BuildPC: sugestões, erros e elogios.">
<meta property="og:type" content="website">
<meta property="og:title" content="BuildPC — Feedback">
<meta property="og:description" content="Conte o que você achou do BuildPC: sugestões, erros e elogios.">

<title>BuildPC — Feedback</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind.config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- Biblioteca do Supabase (conta e perfil) -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="supabase.js"></script>
</head>

<body class="bg-bg-light dark:bg-bg text-ink-light dark:text-ink font-body transition-colors duration-300 min-h-screen">

  <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-copper-light focus:px-4 focus:py-2 focus:text-sm focus:text-white">Pular para o conteúdo</a>

  <nav class="sticky top-0 z-50 flex items-center justify-between px-6 md:px-[6vw] py-5 border-b border-line-light dark:border-line backdrop-blur bg-bg-light/85 dark:bg-bg/85">
    <a href="index.html" class="flex items-center gap-2.5 font-display text-[20px] tracking-tight">
      <svg class="w-[30px] h-[30px] shrink-0 text-copper-light dark:text-accent" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="5" fill="currentColor"/>
        <path d="M2 2h9L2 11z" fill="#0A0D12" opacity=".35"/>
        <g fill="#fff">
          <circle cx="10" cy="10" r="1.9"/><circle cx="16" cy="10" r="1.9"/><circle cx="22" cy="10" r="1.9"/>
          <circle cx="10" cy="16" r="1.9"/><circle cx="16" cy="16" r="1.9"/><circle cx="22" cy="16" r="1.9"/>
          <circle cx="10" cy="22" r="1.9"/><circle cx="16" cy="22" r="1.9"/><circle cx="22" cy="22" r="1.9"/>
        </g>
      </svg>
      <span><span class="font-normal opacity-80">Build</span><span class="font-bold">PC</span></span>
    </a>
    <div class="flex items-center gap-4 text-sm sm:gap-6">
      <a href="buildpc.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Montar PC</a>
      <a href="guia.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Guia</a>
      <a href="feedback.html" aria-current="page" class="text-copper-light dark:text-accent">Feedback</a>
      <div id="conta-area" class="relative flex items-center">
        <a href="login.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Entrar</a>
      </div>
      <button id="theme-btn"
        class="flex items-center gap-2 text-xs font-mono px-3 py-2 rounded-full border border-line-light dark:border-line bg-panel-light dark:bg-panel hover:border-copper-light dark:hover:border-accent transition-colors">
        <span id="theme-label">Modo claro</span>
      </button>
    </div>
  </nav>

  <main id="conteudo" class="px-6 py-14 md:py-20 flex justify-center">
    <div class="w-full max-w-md space-y-6">
      <div>
        <h1 class="font-display font-semibold text-2xl mb-1">Seu feedback</h1>
        <p class="text-sm text-muted-light dark:text-muted">Achou um erro, tem uma ideia ou quer pedir uma peça? Conta pra gente. Lemos tudo.</p>
      </div>

      <section class="border border-line-light dark:border-line rounded-xl p-6 bg-panel-light dark:bg-panel">
        <div id="fb-msg" class="hidden mb-4 text-sm rounded-lg px-3 py-2" aria-live="polite"></div>
        <form id="form-feedback" novalidate>
          <fieldset class="mb-4">
            <legend class="block text-sm mb-1.5">Sobre o quê?</legend>
            <div id="fb-tipos" class="flex flex-wrap gap-2 text-sm">
              <label class="cursor-pointer"><input type="radio" name="tipo" value="sugestao" class="peer sr-only" checked><span class="block rounded-full border border-line-light dark:border-line px-3 py-1.5 text-muted-light dark:text-muted transition-colors peer-checked:border-copper-light dark:peer-checked:border-accent peer-checked:text-copper-light dark:peer-checked:text-accent peer-focus-visible:outline peer-focus-visible:outline-2">Sugestão</span></label>
              <label class="cursor-pointer"><input type="radio" name="tipo" value="erro" class="peer sr-only"><span class="block rounded-full border border-line-light dark:border-line px-3 py-1.5 text-muted-light dark:text-muted transition-colors peer-checked:border-copper-light dark:peer-checked:border-accent peer-checked:text-copper-light dark:peer-checked:text-accent peer-focus-visible:outline peer-focus-visible:outline-2">Erro</span></label>
              <label class="cursor-pointer"><input type="radio" name="tipo" value="elogio" class="peer sr-only"><span class="block rounded-full border border-line-light dark:border-line px-3 py-1.5 text-muted-light dark:text-muted transition-colors peer-checked:border-copper-light dark:peer-checked:border-accent peer-checked:text-copper-light dark:peer-checked:text-accent peer-focus-visible:outline peer-focus-visible:outline-2">Elogio</span></label>
              <label class="cursor-pointer"><input type="radio" name="tipo" value="outro" class="peer sr-only"><span class="block rounded-full border border-line-light dark:border-line px-3 py-1.5 text-muted-light dark:text-muted transition-colors peer-checked:border-copper-light dark:peer-checked:border-accent peer-checked:text-copper-light dark:peer-checked:text-accent peer-focus-visible:outline peer-focus-visible:outline-2">Outro</span></label>
            </div>
          </fieldset>

          <div class="mb-4">
            <label for="fb-mensagem" class="block text-sm mb-1.5">Mensagem</label>
            <textarea id="fb-mensagem" rows="6" maxlength="2000" required aria-describedby="fb-contador" class="w-full rounded-lg border border-field-light dark:border-field bg-bg-light dark:bg-bg px-3.5 py-2.5 text-sm outline-none focus-visible:border-copper-light dark:focus-visible:border-accent transition-colors"
              placeholder="Escreva aqui. Se for um erro, diga em qual tela aconteceu e o que você fez."></textarea>
            <p id="fb-contador" class="mt-1 text-right text-xs text-muted-light dark:text-muted">0 / 2000</p>
          </div>

          <div class="mb-5">
            <label for="fb-email" class="block text-sm mb-1.5">E-mail <span class="text-muted-light dark:text-muted">(opcional, só se quiser resposta)</span></label>
            <input type="email" id="fb-email" maxlength="120" autocomplete="email" class="w-full rounded-lg border border-field-light dark:border-field bg-bg-light dark:bg-bg px-3.5 py-2.5 text-sm outline-none focus-visible:border-copper-light dark:focus-visible:border-accent transition-colors" placeholder="voce@email.com">
          </div>

          <!-- Isca para robôs: pessoas não veem nem preenchem -->
          <div class="absolute -left-[9999px]" aria-hidden="true">
            <label for="fb-site">Não preencha este campo</label>
            <input type="text" id="fb-site" tabindex="-1" autocomplete="off">
          </div>

          <button type="submit" id="btn-feedback"
            class="w-full bg-copper-light dark:bg-copper text-white font-display font-semibold text-sm px-5 py-3 rounded-lg hover:brightness-110 transition-[filter] disabled:opacity-60 disabled:cursor-not-allowed">
            Enviar feedback
          </button>
        </form>
      </section>

      <p class="text-center text-xs text-muted-light dark:text-muted">
        <a href="index.html" class="hover:text-ink-light dark:hover:text-ink transition-colors">← Voltar para o início</a>
      </p>
    </div>
  </main>

  <script defer src="conta.js"></script>
  <script defer src="feedback.js"></script>
  <script defer src="script.js"></script>
</body>
</html>
