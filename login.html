<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0D12">
<meta name="description" content="Entre ou crie sua conta no BuildPC para salvar e comparar seus builds.">
<meta property="og:type" content="website">
<meta property="og:title" content="BuildPC — Entrar">
<meta property="og:description" content="Entre ou crie sua conta no BuildPC para salvar e comparar seus builds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='5' fill='%23241ec9'/%3E%3Cg fill='white'%3E%3Ccircle cx='10' cy='10' r='2'/%3E%3Ccircle cx='16' cy='10' r='2'/%3E%3Ccircle cx='22' cy='10' r='2'/%3E%3Ccircle cx='10' cy='16' r='2'/%3E%3Ccircle cx='16' cy='16' r='2'/%3E%3Ccircle cx='22' cy='16' r='2'/%3E%3Ccircle cx='10' cy='22' r='2'/%3E%3Ccircle cx='16' cy='22' r='2'/%3E%3Ccircle cx='22' cy='22' r='2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>try{var t=localStorage.getItem('buildpc:tema');var claro=t?t==='claro':window.matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.classList.toggle('dark',!claro);}catch(e){}</script>
<title>BuildPC — Entrar</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind.config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- Biblioteca do Supabase (autenticação) -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="supabase.js"></script>
</head>

<body class="bg-bg-light dark:bg-bg text-ink-light dark:text-ink font-body transition-colors duration-300 min-h-screen">

  <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-copper-light focus:px-4 focus:py-2 focus:text-sm focus:text-white">Pular para o conteúdo</a>

  <nav class="sticky top-0 z-50 flex items-center justify-between px-6 md:px-[6vw] py-5 border-b border-line-light dark:border-line backdrop-blur bg-bg-light/85 dark:bg-bg/85">
    <a href="index.html" class="flex items-center gap-2.5 font-display text-[20px] tracking-tight">
      <svg class="w-[30px] h-[30px] shrink-0 text-copper-light dark:text-accent" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="5" fill="currentColor"/>
        <path d="M2 2h9L2 11z" fill="#0A0D12" opacity=".35"/>
        <g fill="#fff">
          <circle cx="10" cy="10" r="1.9"/><circle cx="16" cy="10" r="1.9"/><circle cx="22" cy="10" r="1.9"/>
          <circle cx="10" cy="16" r="1.9"/><circle cx="16" cy="16" r="1.9"/><circle cx="22" cy="16" r="1.9"/>
          <circle cx="10" cy="22" r="1.9"/><circle cx="16" cy="22" r="1.9"/><circle cx="22" cy="22" r="1.9"/>
        </g>
      </svg>
      <span><span class="font-normal opacity-80">Build</span><span class="font-bold">PC</span></span>
    </a>
    <div class="flex items-center gap-4 text-sm sm:gap-6">
      <a href="buildpc.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Montar PC</a>
      <a href="guia.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Guia</a>
      <a href="feedback.html" class="text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">Feedback</a>
      <button id="theme-btn"
        class="flex items-center gap-2 text-xs font-mono px-3 py-2 rounded-full border border-line-light dark:border-line bg-panel-light dark:bg-panel hover:border-copper-light dark:hover:border-accent transition-colors">
        <span id="theme-label">Modo claro</span>
      </button>
    </div>
  </nav>

  <main id="conteudo" class="relative px-6 py-16 md:py-24 min-h-[calc(100vh-77px)] flex items-center justify-center overflow-hidden">
    <!-- Mesma trilha de cobre do hero da home, aqui bem discreta, só pra
         não ser uma tela genérica de login isolada do resto do site. -->
    <svg class="pointer-events-none select-none absolute -left-[10vw] top-1/2 -translate-y-1/2 w-[46vw] max-w-[520px] min-w-[320px] h-auto opacity-[0.08] dark:opacity-[0.10]" viewBox="0 0 500 460" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M40 40 H 220 L 260 80 V 200 L 300 240 H 460" stroke="#C97B3D" stroke-width="2.5"/>
      <path d="M60 120 H 160 L 190 150 V 340 L 220 370 H 340" stroke="#C97B3D" stroke-width="2.5"/>
      <g fill="#C97B3D">
        <circle cx="220" cy="40" r="4.5"/><circle cx="260" cy="80" r="4.5"/><circle cx="300" cy="240" r="4.5"/>
        <circle cx="160" cy="120" r="4.5"/><circle cx="190" cy="150" r="4.5"/><circle cx="220" cy="370" r="4.5"/>
      </g>
    </svg>

    <div class="relative w-full max-w-sm">
      <div class="border border-line-light dark:border-line rounded-xl p-7 md:p-8 bg-panel-light dark:bg-panel">

        <!-- Abas Entrar / Criar conta, no mesmo estilo "pino" das categorias da montagem -->
        <div id="auth-tabs" class="flex gap-1 mb-6 text-sm border-b border-line-light dark:border-line" role="group" aria-label="Entrar ou criar conta">
          <button type="button" id="tab-entrar" class="pin-tab flex-1" aria-pressed="true">Entrar</button>
          <button type="button" id="tab-criar" class="pin-tab flex-1" aria-pressed="false">Criar conta</button>
        </div>

        <h1 id="auth-titulo" class="font-display font-semibold text-xl mb-1">Entre na sua conta</h1>
        <p id="auth-subtitulo" class="text-sm text-muted-light dark:text-muted mb-6">Acesse pra salvar e comparar seus builds.</p>

        <!-- Mensagem de erro/sucesso -->
        <div id="auth-mensagem" class="hidden mb-4 text-sm rounded-lg px-3 py-2" aria-live="polite"></div>

        <form id="form-auth" novalidate>
          <div id="campo-nome-wrap" class="hidden mb-4">
            <label for="campo-nome" class="block text-sm mb-1.5">Nome</label>
            <input type="text" id="campo-nome" name="nome" autocomplete="name" maxlength="60"
              class="w-full rounded-lg border border-field-light dark:border-field bg-bg-light dark:bg-bg px-3.5 py-2.5 text-sm outline-none focus-visible:border-copper-light dark:focus-visible:border-accent transition-colors"
              placeholder="Como você quer ser chamado(a)">
          </div>

          <div class="mb-4">
            <label for="campo-email" class="block text-sm mb-1.5">E-mail</label>
            <input type="email" id="campo-email" name="email" required autocomplete="email"
              class="w-full rounded-lg border border-field-light dark:border-field bg-bg-light dark:bg-bg px-3.5 py-2.5 text-sm outline-none focus-visible:border-copper-light dark:focus-visible:border-accent transition-colors"
              placeholder="voce@email.com">
          </div>

          <div id="campo-senha-wrap" class="mb-2">
            <label for="campo-senha" class="block text-sm mb-1.5">Senha</label>
            <div class="relative">
              <input type="password" id="campo-senha" name="senha" required autocomplete="current-password" maxlength="72"
                class="w-full rounded-lg border border-field-light dark:border-field bg-bg-light dark:bg-bg px-3.5 py-2.5 pr-11 text-sm outline-none focus-visible:border-copper-light dark:focus-visible:border-accent transition-colors">
              <button type="button" id="toggle-senha" aria-label="Mostrar senha" aria-pressed="false"
                class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-muted-light dark:text-muted hover:text-ink-light dark:hover:text-ink transition-colors">
                <svg id="icone-olho" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <p class="mb-5 text-right">
            <button type="button" id="link-esqueci" class="text-xs text-muted-light dark:text-muted hover:text-copper-light dark:hover:text-accent transition-colors underline underline-offset-2">Esqueceu a senha?</button>
          </p>

          <button type="submit" id="btn-enviar"
            class="w-full bg-copper-light dark:bg-copper text-white font-display font-semibold text-sm px-5 py-3 rounded-lg hover:brightness-110 transition-[filter] disabled:opacity-60 disabled:cursor-not-allowed">
            Entrar
          </button>
        </form>

        <p id="voltar-entrar-wrap" class="hidden mt-4 text-center">
          <button type="button" id="voltar-entrar" class="text-xs text-muted-light dark:text-muted hover:text-copper-light dark:hover:text-accent transition-colors underline underline-offset-2">Voltar para entrar</button>
        </p>
      </div>

      <p class="mt-6 text-center text-xs text-muted-light dark:text-muted">
        <a href="index.html" class="hover:text-ink-light dark:hover:text-ink transition-colors">← Voltar para o início</a>
      </p>
    </div>
  </main>

  <script defer src="senha.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="script.js"></script>
</body>
</html>
